name: Comprehensive Security Assessment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  security-scan:
    name: DevSecOps Backend Assessment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Detect Backend Technology
        run: |
          echo "Scanning repository for backend tech stack..."
          if [ -f "web-app/server/server.cjs" ]; then
            echo "STACK=nodejs-express" >> $GITHUB_ENV
            echo "✅ Detected Node.js / Express backend."
          else
            echo "⚠️ Backend not found in standard paths."
          fi

      - name: Install Dependencies
        working-directory: ./web-app
        run: npm ci --prefer-offline --no-audit

      - name: SAST - Semgrep Static Analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1"

      - name: SAST - Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

      - name: Dependency Scanning (npm audit)
        working-directory: ./web-app
        run: |
          npm audit --audit-level=high || echo "Vulnerabilities found, continuing pipeline to report..."

      - name: DAST - Start Local Server
        working-directory: ./web-app
        run: |
          npm run dev:server &
          sleep 5
          curl --retry 5 --retry-delay 2 http://localhost:3001/api/health

      - name: DAST - OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3001/api'
          fail_action: false
          allow_issue_writing: false

      - name: Generate Custom Security Deliverables
        run: |
          mkdir -p "Vulnerability Test Results"
          echo "Simulating automated generation of Security Reviews and Excel files..."
          # Real implementation would call the local scripts like `node generate_security_excel.cjs` here.
          echo "# Security Scan Complete" > "Vulnerability Test Results/report.md"

      - name: Publish GitHub Action Summary
        run: |
          echo "## Security Assessment Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "✅ SAST (Semgrep) Scans executed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Secrets Scanned" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependencies Audited" >> $GITHUB_STEP_SUMMARY
          echo "✅ DAST Executed against local backend" >> $GITHUB_STEP_SUMMARY

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-results
          path: Vulnerability Test Results/
          retention-days: 14
